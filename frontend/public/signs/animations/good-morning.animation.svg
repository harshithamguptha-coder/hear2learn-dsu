  <g>
    <path d="M217 275c-13-25-19-48-16-70 2-12 17-15 23-4l20 38-3-74c0-14 19-16 22-2l8 70 15-62c4-13 23-8 21 6l-13 80 27-45c7-12 25-3 19 11l-30 62c-13 28-35 42-62 42-24 0-43-18-51-52Z" fill="#f3b38f" stroke="#8a4f35" stroke-width="7" stroke-linejoin="round"/>
