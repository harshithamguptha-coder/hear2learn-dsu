<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Open your book animated sign cue</title>
  <desc id="desc">A short looping illustration of two hands opening a book.</desc>
  <rect width="640" height="360" rx="24" fill="#e7f6ee"/>
  <circle cx="320" cy="116" r="54" fill="#ffd9b8"/>
  <path d="M266 171c-27 18-39 45-36 77h180c3-32-11-59-36-77-15 11-32 16-49 16s-44-5-59-16Z" fill="#6941a5"/>
  <g>
