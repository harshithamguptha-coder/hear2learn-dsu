    <animateTransform attributeName="transform" type="rotate" values="-7 320 270;0 320 270;-7 320 270" dur="2.2s" repeatCount="indefinite"/>
  </g>
  <g>
    <path d="M478 250c-36-24-79-31-126-20l-14 4 17 36 123 4Z" fill="#fff" stroke="#34577f" stroke-width="7"/>
    <animateTransform attributeName="transform" type="rotate" values="7 320 270;0 320 270;7 320 270" dur="2.2s" repeatCount="indefinite"/>
  </g>
