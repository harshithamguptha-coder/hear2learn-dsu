  <path d="M455 265c-38-18-81-22-125-10" fill="none" stroke="#8aa8c5" stroke-width="5" stroke-linecap="round"/>
  <rect x="186" y="314" width="268" height="30" rx="15" fill="#fff"/>
  <text x="320" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1d563d">Open your book</text>
